name: Build A1 Chess APK

on:
  push:
    branches:
      - "main"
      - "dev"
      - "release/**"
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: { }

permissions:
  contents: write

env:
  TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 0. Cancel duplicate runs ─────────────────────────────────────────
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      # ── 1. Notify: Build started ─────────────────────────────────────────
      - name: Telegram — Build started
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$(printf '🔨 *A1 Chess v1.2 — Build Started*\n\n📌 Branch: `%s`\n🔢 Build: #%s\n📝 Commit: `%s`\n\n⏳ Compiling Stockfish 16 + assembling APK...' \
              '${{ github.ref_name }}' '${{ github.run_number }}' "$SHORT_SHA")"

      # ── 2. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 3. Java ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Android NDK ───────────────────────────────────────────────────
      - name: Setup Android NDK r25c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      # ── 5. Gradle cache ──────────────────────────────────────────────────
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 6. Stockfish binary cache ────────────────────────────────────────
      - name: Restore Stockfish 16 ARM64 cache
        id: sf-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libstockfish.so
          key: stockfish-16-arm64-ndk-r25c-jniLibs-v2

      # ── 7. Build Stockfish 16 from source ────────────────────────────────
      - name: Build Stockfish 16 for Android ARM64
        if: steps.sf-cache.outputs.cache-hit != 'true'
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          sudo apt-get install -y --no-install-recommends build-essential

          curl -fsSL https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_16.tar.gz | tar -xz
          cd Stockfish-sf_16/src

          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CXX_BIN="$TOOLCHAIN/bin/aarch64-linux-android21-clang++"

          sed -i 's/^build: config-sanity/build:/' Makefile 2>/dev/null || true
          echo "Patched: config-sanity skipped for cross-compilation"

          make -j$(nproc) \
            ARCH=armv8 \
            COMP=clang \
            CXX="$CXX_BIN" \
            CXXFLAGS="-O2 -DNDEBUG -std=c++17" \
            LDFLAGS="-static-libstdc++ -lm" \
            build

          "$TOOLCHAIN/bin/llvm-strip" stockfish || true

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          echo "Stockfish (jniLib): $(wc -c < $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so) bytes"

      # ── 8. Verify Stockfish ───────────────────────────────────────────────
      - name: Verify Stockfish binary
        run: |
          [ -f app/src/main/jniLibs/arm64-v8a/libstockfish.so ] || { echo "FATAL: Missing libstockfish.so"; exit 1; }
          echo "OK: $(wc -c < app/src/main/jniLibs/arm64-v8a/libstockfish.so) bytes"
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so || true

      # ── 9. Permanent signing keystore ─────────────────────────────────────
      # Set SIGNING_KEYSTORE_B64 as a GitHub repository secret (base64 of .jks)
      # so every build uses the SAME key — required for APK updates to install
      # without uninstalling first.  On first run without the secret a fresh
      # keystore is generated and its base64 is printed so you can save it.
      - name: Restore / generate signing keystore
        run: |
          mkdir -p signing
          if [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then
            echo "Using stored keystore from secret SIGNING_KEYSTORE_B64"
            echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > signing/signing-key.jks
            echo "Keystore restored: $(wc -c < signing/signing-key.jks) bytes"
          else
            echo "⚠️  No SIGNING_KEYSTORE_B64 secret found — generating a new keystore."
            echo "   Copy the base64 block below and save it as a GitHub repository"
            echo "   secret named SIGNING_KEYSTORE_B64 to make signing permanent."
            keytool -genkeypair \
              -alias A1Chess -keypass 123456 \
              -keystore signing/signing-key.jks \
              -storepass 123456 \
              -dname "CN=A1Chess,OU=Dev,O=RDChess,L=India,S=India,C=IN" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
            echo "=== COPY THIS AS SIGNING_KEYSTORE_B64 SECRET ==="
            base64 signing/signing-key.jks
            echo "=================================================="
          fi

      # ── 10. Signing config ────────────────────────────────────────────────
      - name: Create local.properties
        run: |
          printf 'signing.storeFile=signing/signing-key.jks\nsigning.storePassword=123456\nsigning.keyAlias=A1Chess\nsigning.keyPassword=123456\n' > local.properties

      # ── 11. Make gradlew executable ───────────────────────────────────────
      - name: chmod gradlew
        run: chmod +x ./gradlew

      # ── 12. Assemble Release APK ──────────────────────────────────────────
      - name: Assemble Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          echo "BUILD_STATUS=success" >> $GITHUB_ENV

      # ── 13. Get version ───────────────────────────────────────────────────
      - name: Get version info
        id: version
        run: |
          VER=$(grep 'versionName' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          BUILD=${{ github.run_number }}
          echo "name=$VER" >> $GITHUB_OUTPUT
          echo "apk_name=A1Chess-v${VER}-b${BUILD}.apk" >> $GITHUB_OUTPUT

      # ── 14. Rename APK ────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}"

      # ── 15. Upload artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: app/build/outputs/apk/release/A1Chess-*.apk
          retention-days: 30

      # ── 16. Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "A1 Chess v${{ steps.version.outputs.name }} (Build #${{ github.run_number }})"
          body: |
            **A1 Chess v1.2 — Automated Release**

            Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`
            Engine: **Stockfish 16** (ARM64, compiled from source)

            **What's new in v1.2:**
            - Pawn promotion dialog — choose Queen / Rook / Bishop / Knight
            - King flashes red when in check; solid red on checkmate
            - Game history tab — completed games saved automatically
            - Scrollable game screen — analysis panel always reachable
            - Time control picker — 1 / 3 / 5 / 10 / 15 / 30 min
            - Zero lag — eval updates no longer recompose the entire UI
            - Engine level slider restarts analysis immediately
            - Permanent signing key — updates install without uninstalling
          draft: false
          prerelease: true
          files: app/build/outputs/apk/release/A1Chess-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 17. Telegram — SUCCESS ────────────────────────────────────────────
      - name: Telegram — Success notification
        if: success()
        run: |
          RELEASE_URL="https://github.com/RD7890/A1Chess-Android/releases"
          ARTIFACT_URL="https://github.com/RD7890/A1Chess-Android/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$(printf '✅ *A1 Chess v1.2 Build #%s — SUCCESS*\n\n📦 APK: `%s`\n🌿 Branch: `%s`\n🔖 Commit: `%s`\n⚙️ Engine: Stockfish 16 ARM64\n\n🔗 *Download APK:*\n[GitHub Release](%s)\n[Build Artifacts](%s)' \
              '${{ github.run_number }}' \
              '${{ steps.version.outputs.apk_name }}' \
              '${{ github.ref_name }}' \
              "$SHORT_SHA" "$RELEASE_URL" "$ARTIFACT_URL")"
          tail -200 build.log > build_summary.log
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT_ID}" \
            -F document=@build_summary.log \
            -F caption="📋 Build #${{ github.run_number }} — raw log (last 200 lines)"

      # ── 18. Telegram — FAILURE ────────────────────────────────────────────
      - name: Telegram — Failure notification
        if: failure()
        run: |
          ACTIONS_URL="https://github.com/RD7890/A1Chess-Android/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$(printf '❌ *A1 Chess v1.2 Build #%s — FAILED*\n\n🌿 Branch: `%s`\n🔖 Commit: `%s`\n\n🔍 [View full logs](%s)\n\nLog excerpt attached below 👇' \
              '${{ github.run_number }}' '${{ github.ref_name }}' "$SHORT_SHA" "$ACTIONS_URL")"
          if [ -f build.log ]; then tail -200 build.log > fail_log.txt
          else echo "Build failed before Gradle step" > fail_log.txt; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT_ID}" \
            -F document=@fail_log.txt \
            -F caption="💥 Failure log — Build #${{ github.run_number }}"
